name: Post-commit

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    uses: ./.github/workflows/_build-test.yml
    with:
      os: ${{ matrix.os }}
    permissions:
      checks: write
      contents: read

  web-e2e:
    uses: ./.github/workflows/_web-e2e.yml
    secrets:
      STRIDE_OPENROUTER_API_KEY: ${{ secrets.STRIDE_OPENROUTER_API_KEY }}
