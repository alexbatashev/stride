name: Pre-commit

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get install -y capnproto libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: tsc
        run: pnpm --dir server/frontend install --frozen-lockfile && pnpm --dir server/frontend check

  test:
    uses: ./.github/workflows/_build-test.yml
    with:
      os: ubuntu-latest
    permissions:
      checks: write
      contents: read

  migration-compatibility:
    name: Database migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system deps
        run: sudo apt-get install -y capnproto libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Disable rust-lld
        run: echo "RUSTFLAGS=-Clinker-features=-lld" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Check migration compatibility
        run: |
          cp .github/scripts/check-migration-compatibility.sh "$RUNNER_TEMP/"
          "$RUNNER_TEMP/check-migration-compatibility.sh"

  web-e2e:
    uses: ./.github/workflows/_web-e2e.yml
    secrets:
      STRIDE_OPENROUTER_API_KEY: ${{ secrets.STRIDE_OPENROUTER_API_KEY }}
